<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>DAS Admin Login</title><link rel=stylesheet href=/admin/admin.css></head><body class=login><div class=loginbox><img src=/assets/logo/das-logo.jpg><h1>Admin Login</h1><input id=u placeholder=Username><input id=p type=password placeholder=Password><button onclick=go()>Login</button><p id=m></p><a href=/>← Customer Website</a></div><script>async function go(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(r.ok){localStorage.adminToken=d.token;location='/admin/dashboard.html'}else m.textContent=d.error}</script></body></html>
